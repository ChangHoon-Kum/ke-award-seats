name: 보너스 좌석 수집

on:
  # 2026-11-14: 대한항공이 요청을 전부 거부(HTTP 403)해서 예약 실행을 중단함. 수동 실행만 가능.
  # schedule:
  #   - cron: '47 14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'collect = 전체 수집 / telegram-test = 텔레그램 연결 테스트 / quick = 인천-LA 2개월만'
        type: choice
        options: [collect, telegram-test, quick]
        default: collect

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test test/lib.test.mjs

      - name: Collect
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          TELEGRAM_TEST: ${{ inputs.mode == 'telegram-test' && '1' || '' }}
          ONLY: ${{ inputs.mode == 'quick' && 'ICN-LAX,LAX-ICN' || '' }}
          MONTHS: ${{ inputs.mode == 'quick' && '2' || '' }}
        run: node scripts/collect.mjs

      - name: Commit data
        if: ${{ inputs.mode != 'telegram-test' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if [ -d reports ]; then git add reports README.md; fi
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git push
          fi
